<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title-dark desc-dark">
  <title id="title-dark">work-tracker architecture: pwd-scoped SQLite WAL session memory</title>
  <desc id="desc-dark">Diagram showing how startup, /clear, and /compact sessions write to and read from a single pwd-scoped SQLite WAL ledger via CLI commands, resume brief, SessionStart hook, and read-only HTML dashboard.</desc>
  <defs>
    <marker id="arrow-blue-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrow-green-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#3fb950"/>
    </marker>
    <marker id="arrow-muted-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="1" y="1" width="1198" height="518" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Top Header Band -->
  <rect x="28" y="25" width="40" height="40" rx="10" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
  <rect x="37" y="36" width="14" height="3" rx="1.5" fill="#58a6ff"/>
  <rect x="37" y="44" width="22" height="3" rx="1.5" fill="#8b949e"/>
  <rect x="37" y="52" width="18" height="3" rx="1.5" fill="#8b949e"/>
  <circle cx="57" cy="37.5" r="3" fill="#3fb950"/>

  <text x="80" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#e6edf3">work-tracker</text>
  <text x="80" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e">Deterministic pwd-scoped session memory for humans &amp; AI agents</text>

  <!-- Header Badges -->
  <rect x="768" y="30" width="146" height="28" rx="14" fill="#1f6feb" fill-opacity="0.16" stroke="#388bfd" stroke-opacity="0.6" stroke-width="1"/>
  <text x="841" y="48" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#58a6ff">Rust · SQLite WAL</text>

  <rect x="924" y="30" width="112" height="28" rx="14" fill="#238636" fill-opacity="0.18" stroke="#3fb950" stroke-opacity="0.55" stroke-width="1"/>
  <text x="980" y="48" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#3fb950">Zero Daemon</text>

  <rect x="1046" y="30" width="130" height="28" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="1111" y="48" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#e6edf3">CLI · JSON · HTML</text>

  <line x1="24" y1="88" x2="1176" y2="88" stroke="#21262d" stroke-width="1.5"/>

  <!-- Left Column: Agent & CLI Sessions (x=24..304, w=280) -->
  <rect x="24" y="106" width="280" height="338" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <text x="38" y="129" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.6" fill="#8b949e">AGENT &amp; CLI SESSIONS</text>
  <text x="38" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#7d8590">Ephemeral context per working dir</text>

  <!-- Card: startup -->
  <rect x="36" y="162" width="256" height="60" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <rect x="48" y="173" width="74" height="22" rx="6" fill="#238636" fill-opacity="0.2" stroke="#3fb950" stroke-opacity="0.55" stroke-width="1"/>
  <text x="85" y="188" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#3fb950">startup</text>
  <text x="132" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#e6edf3">Fresh Session</text>
  <text x="48" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e">New shell, worktree, or agent start</text>

  <!-- Card: /clear -->
  <rect x="36" y="232" width="256" height="60" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <rect x="48" y="243" width="74" height="22" rx="6" fill="#8957e5" fill-opacity="0.2" stroke="#bc8cff" stroke-opacity="0.55" stroke-width="1"/>
  <text x="85" y="258" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#bc8cff">/clear</text>
  <text x="132" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#e6edf3">Context Reset</text>
  <text x="48" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e">Wiped conversation window</text>

  <!-- Card: /compact -->
  <rect x="36" y="302" width="256" height="60" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <rect x="48" y="313" width="74" height="22" rx="6" fill="#9e6a03" fill-opacity="0.22" stroke="#d29922" stroke-opacity="0.6" stroke-width="1"/>
  <text x="85" y="328" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#d29922">/compact</text>
  <text x="132" y="328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#e6edf3">Compacted Session</text>
  <text x="48" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e">Compressed conversation history</text>

  <!-- Hook Matcher Strip -->
  <rect x="36" y="374" width="256" height="54" rx="8" fill="#0d1117" stroke="#388bfd" stroke-opacity="0.45" stroke-width="1"/>
  <text x="48" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8b949e">SessionStart hook matcher</text>
  <text x="48" y="415" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#58a6ff">"startup|clear|compact"</text>

  <!-- Center Column: SQLite WAL Ledger (x=428..774, w=346) -->
  <rect x="428" y="106" width="346" height="338" rx="12" fill="#161b22" stroke="#388bfd" stroke-width="1.6"/>
  <text x="444" y="129" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.6" fill="#58a6ff">SQLITE WAL LEDGER</text>
  <rect x="610" y="114" width="150" height="22" rx="11" fill="#1f6feb" fill-opacity="0.18" stroke="#388bfd" stroke-opacity="0.5" stroke-width="1"/>
  <text x="685" y="129" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#58a6ff">Single Source of Truth</text>

  <!-- Sub-panel A: work_items -->
  <rect x="442" y="148" width="318" height="154" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="454" y="168" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#e6edf3">work_items</text>
  <text x="534" y="168" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#7d8590">workdir: /srv/work/repo-wt</text>
  <line x1="442" y1="179" x2="760" y2="179" stroke="#21262d" stroke-width="1"/>

  <!-- Row 1: blocked -->
  <circle cx="458" cy="204" r="4" fill="#f85149"/>
  <rect x="470" y="194" width="64" height="20" rx="5" fill="#da3633" fill-opacity="0.2" stroke="#f85149" stroke-opacity="0.55" stroke-width="1"/>
  <text x="502" y="208" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#f85149">blocked</text>
  <text x="544" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#e6edf3">#12 Fix WAL lock contention test</text>

  <!-- Row 2: active -->
  <circle cx="458" cy="238" r="4" fill="#3fb950"/>
  <rect x="470" y="228" width="64" height="20" rx="5" fill="#238636" fill-opacity="0.2" stroke="#3fb950" stroke-opacity="0.55" stroke-width="1"/>
  <text x="502" y="242" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#3fb950">active</text>
  <text x="544" y="242" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#e6edf3">#14 Profile index scan query</text>

  <!-- Row 3: waiting -->
  <circle cx="458" cy="272" r="4" fill="#d29922"/>
  <rect x="470" y="262" width="64" height="20" rx="5" fill="#9e6a03" fill-opacity="0.22" stroke="#d29922" stroke-opacity="0.6" stroke-width="1"/>
  <text x="502" y="276" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#d29922">waiting</text>
  <text x="544" y="276" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#e6edf3">#15 Company CI regression run</text>

  <!-- Sub-panel B: history_entries -->
  <rect x="442" y="312" width="318" height="96" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="454" y="332" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#e6edf3">history_entries</text>
  <text x="566" y="332" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8b949e">append-only · same txn</text>

  <!-- Timeline pills -->
  <rect x="454" y="346" width="56" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="482" y="362" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#e6edf3">create</text>
  <line x1="512" y1="358" x2="524" y2="358" stroke="#8b949e" stroke-width="1.4" marker-end="url(#arrow-muted-dark)"/>

  <rect x="528" y="346" width="48" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="552" y="362" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#e6edf3">note</text>
  <line x1="578" y1="358" x2="590" y2="358" stroke="#8b949e" stroke-width="1.4" marker-end="url(#arrow-muted-dark)"/>

  <rect x="594" y="346" width="56" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="622" y="362" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#e6edf3">status</text>
  <line x1="652" y1="358" x2="664" y2="358" stroke="#8b949e" stroke-width="1.4" marker-end="url(#arrow-muted-dark)"/>

  <rect x="668" y="346" width="80" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="708" y="362" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#8b949e">delete 60d</text>

  <text x="454" y="394" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#7d8590">Idempotent status repeats emit zero history noise</text>

  <text x="601" y="429" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#8b949e">5s busy timeout · quick_check · WAL snapshots</text>

  <!-- Right Column: Read & Resume Surfaces (x=892..1176, w=284) -->
  <rect x="892" y="106" width="284" height="338" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <text x="906" y="129" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.6" fill="#8b949e">READ &amp; RESUME SURFACES</text>

  <!-- Surface Card 1 -->
  <rect x="904" y="150" width="260" height="86" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="918" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#e6edf3">Resume Brief &amp; Hook</text>
  <text x="918" y="196" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#3fb950">brief · hook session-start</text>
  <text x="918" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8b949e">Exact pwd · attention order · exits 0</text>

  <!-- Surface Card 2 -->
  <rect x="904" y="246" width="260" height="86" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="918" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#e6edf3">Structured CLI &amp; Views</text>
  <text x="918" y="292" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#58a6ff">list --here --compact --json</text>
  <text x="918" y="314" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8b949e">today · todo --days N · search</text>

  <!-- Surface Card 3 -->
  <rect x="904" y="342" width="260" height="86" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="918" y="366" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#e6edf3">Read-Only HTML Dashboard</text>
  <text x="918" y="388" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#bc8cff">serve (127.0.0.1:8787)</text>
  <text x="918" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8b949e">SSH tunnel · loopback Host guard</text>

  <!-- Connector 1: Left <-> Center (x=304..428, center=366) -->
  <text x="366" y="195" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#58a6ff">CLI writes</text>
  <line x1="310" y1="210" x2="418" y2="210" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue-dark)"/>
  <text x="366" y="228" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#8b949e">add · status · note</text>

  <text x="366" y="331" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#3fb950">hook / brief</text>
  <line x1="422" y1="346" x2="314" y2="346" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow-green-dark)"/>
  <text x="366" y="364" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#8b949e">&lt;= 9,000 chars</text>

  <!-- Connector 2: Center -> Right (x=774..892) -->
  <text x="811" y="275" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#8b949e">read-only</text>
