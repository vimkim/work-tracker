  <line x1="848" y1="193" x2="848" y2="385" stroke="#8b949e" stroke-width="1.8"/>
  <line x1="848" y1="193" x2="884" y2="193" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arrow-muted-dark)"/>
  <line x1="848" y1="289" x2="884" y2="289" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arrow-muted-dark)"/>
  <line x1="848" y1="385" x2="884" y2="385" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arrow-muted-dark)"/>

  <!-- Bottom Guarantee Footer -->
  <rect x="24" y="460" width="1152" height="40" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>

  <circle cx="52" cy="480" r="4" fill="#58a6ff"/>
  <text x="64" y="484" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#e6edf3">pwd-scoped Work Directory</text>

  <circle cx="336" cy="480" r="4" fill="#3fb950"/>
  <text x="348" y="484" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#e6edf3">Atomic transactional history</text>

  <circle cx="628" cy="480" r="4" fill="#d29922"/>
  <text x="640" y="484" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#e6edf3">60-day soft-delete retention</text>

  <circle cx="916" cy="480" r="4" fill="#bc8cff"/>
  <text x="928" y="484" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#e6edf3">Verified SQLite WAL backups</text>
